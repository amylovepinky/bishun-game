<title>筆順小畫家</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one column "習字簿" — a sky-blue desk, white workbook cards, and the classic red 田字格 as the hero of every screen. Single light look by choice (paper). */
:root{
  color-scheme: light;
  --desk:#DDF0FF;      /* sky desk */
  --paper:#FFFFFF;
  --ink:#22304A;       /* navy pencil */
  --ink-soft:#5B6884;
  --grid:#E5484D;      /* workbook red grid */
  --guide:#D9DEE8;     /* gray outline to trace */
  --sun:#FF8A2A;       /* main accent */
  --leaf:#22A86A;      /* correct */
  --berry:#7C5CF0;
  --line:#C9D8EA;
  --font-kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti",serif;
  --font-ui:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:18px;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-ui);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:12px 32px}
.screen{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.bar .title{flex:1;min-width:0;font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 var(--line)}
.starcount{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:99px;padding:6px 14px;font-weight:700;box-shadow:0 2px 0 var(--line);font-variant-numeric:tabular-nums}
.starcount b{color:var(--sun)}

/* home */
.hello{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:var(--r);padding:16px;box-shadow:0 3px 0 var(--line)}
.hello .mini{flex:none;width:86px;height:86px}
.hello h1{font-size:25px;line-height:1.3}
.hello p{margin:4px 0 0;color:var(--ink-soft);font-size:15px}
.namebtn{color:var(--berry);text-decoration:underline dotted;text-underline-offset:4px}
.world{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--paper);border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 0 var(--c,var(--line));border:2px solid var(--c,var(--line))}
.world .ico{width:64px;height:64px;border-radius:16px;background:var(--cbg);display:grid;place-items:center;font-family:var(--font-kai);font-size:40px;color:var(--c)}
.world h2{font-size:21px}
.world p{margin:2px 0 0;color:var(--ink-soft);font-size:14.5px}
.world .go{font-size:24px;color:var(--c)}
.world:active,.tile:active{transform:translateY(2px)}

/* unit list */
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.unit{background:var(--paper);border-radius:var(--r);padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--c);border:2px solid var(--c)}
.unit .big{font-family:var(--font-kai);font-size:44px;line-height:1.1;color:var(--c)}
.unit .nm{font-weight:700;font-size:16px}
.unit .ex{color:var(--ink-soft);font-size:13px}
.stars{color:var(--sun);letter-spacing:1px;font-size:14px;min-height:18px}
.stars i{font-style:normal;color:#D7DCE6}

/* unit detail */
.radcard{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:var(--r);padding:14px;border:2px solid var(--c)}
.radcard .pic{font-size:44px}
.radcard h2{font-size:22px}
.radcard p{margin:4px 0 0;color:var(--ink-soft);font-size:15px;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border-radius:16px;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--line)}
.tile svg{width:100%;max-width:110px;aspect-ratio:1;height:auto}
.tile .lb{font-size:14.5px;font-weight:700}
.tile .sub{font-size:12.5px;color:var(--ink-soft)}
.sec{font-size:15px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em;margin-top:4px}

/* free practice */
.freebox{background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.freebox label{font-weight:700}
.freerow{display:flex;gap:10px}
.freerow input{flex:1;min-width:0;font-family:var(--font-kai);font-size:30px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--paper);color:var(--ink)}
.btn{background:var(--sun);color:#fff;font-weight:700;border-radius:14px;padding:12px 18px;box-shadow:0 3px 0 #C85F0C;font-size:18px}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.green{background:var(--leaf);box-shadow:0 3px 0 #147A4B}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-kai);font-size:24px;background:var(--desk);border-radius:12px;min-width:48px;height:48px;padding:0 8px}
.note{font-size:14px;color:var(--ink-soft);line-height:1.6}
.err{color:var(--grid);font-weight:700;min-height:1.4em;font-size:15px}

/* practice */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--paper);padding:5px;border-radius:16px}
.modes button{border-radius:12px;padding:9px 4px;font-weight:700;font-size:16px;color:var(--ink-soft)}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.boardwrap{position:relative;align-self:center;width:min(100%,62vh,520px);aspect-ratio:1;max-width:100%}
.board{width:100%;height:100%;background:var(--paper);border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;display:block;box-shadow:0 4px 0 var(--line)}
[hidden]{display:none!important}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px}
.status .count{flex:none}
.status .say{flex:1;min-width:0;text-align:right;line-height:1.3}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count b{color:var(--sun);font-size:22px}
.say{font-weight:700;font-size:18px;transition:transform .2s}
.say.good{color:var(--leaf)} .say.bad{color:var(--grid)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tool{background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 3px 0 var(--line);font-size:16px}
.neat{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft)}
.neat .meter{flex:1;height:10px;background:var(--desk);border-radius:99px;overflow:hidden}
.neat .meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--leaf));transition:width .4s}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pulse{animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35);opacity:.6}}

/* reward overlay */
.over{position:fixed;inset:0;background:rgba(34,48,74,.45);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-left,0px))}
.over .box{background:var(--paper);border-radius:24px;padding:22px 20px;width:min(100%,380px);text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.over .big{font-size:54px;letter-spacing:4px;color:var(--sun)}
.over .big i{font-style:normal;color:#D7DCE6}
.over h3{font-size:24px}
.over p{margin:0;color:var(--ink-soft)}
.over .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* adventure map */
.mapwrap{position:relative;background:linear-gradient(180deg,#BFE6FF 0%,#D8F3DC 45%,#FFF1C9 100%);border-radius:24px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.mapwrap svg.road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lvl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:128px}
.lvl .node{width:78px;height:78px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.18),inset 0 -6px 0 rgba(0,0,0,.12);border:4px solid #fff;position:relative}
.lvl.locked .node{background:#B9C3D3;font-size:26px}
.lvl.cur .node{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.lvl .cap{background:var(--paper);border-radius:12px;padding:3px 10px;font-weight:700;font-size:15px;max-width:128px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 var(--line)}
.lvl .st{font-size:13px;color:var(--sun);letter-spacing:1px;font-weight:700;text-shadow:0 1px 0 #fff}
.lvl .badge{position:absolute;right:-8px;top:-8px;font-size:28px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.buddy{position:absolute;font-size:40px;transform:translate(-50%,-100%);pointer-events:none;transition:left .6s,top .6s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.deco{position:absolute;font-size:30px;opacity:.9;pointer-events:none}
.mapbar{display:flex;gap:8px;flex-wrap:wrap}
.lvhead{background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border:3px solid var(--c)}
.lvhead h2{font-size:24px}
.prog{height:16px;background:var(--desk);border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--sun));border-radius:99px}
.stickers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stk{background:var(--paper);border-radius:16px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;box-shadow:0 3px 0 var(--line)}
.stk small{font-size:11.5px;color:var(--ink-soft);max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk.no{font-size:30px;color:#C5CDDA;background:#F1F5FA}
/* parent */
.pl{background:var(--paper);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pl .t{display:flex;gap:8px;align-items:baseline}
.pl .t b{font-size:18px}
.pl .chars{font-family:var(--font-kai);font-size:22px;letter-spacing:3px;word-break:break-all}
.pl .acts{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{background:var(--desk);border-radius:10px;padding:7px 12px;font-weight:700;font-size:15px}
.sbtn.danger{color:var(--grid)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.field textarea{font-family:var(--font-kai);font-size:24px;min-height:96px;letter-spacing:2px}
.prev{display:flex;flex-wrap:wrap;gap:6px}
.prev span{font-family:var(--font-kai);font-size:24px;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:var(--desk)}
.prev span.bad{background:#FFE3E3;color:var(--grid);text-decoration:line-through}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:24px;height:24px}
.speed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%;max-width:360px;align-self:center}
.speed span{grid-column:1/-1;text-align:center;font-weight:700;font-size:15px;color:var(--ink-soft)}
.speed button{background:var(--paper);border-radius:99px;padding:8px 4px;font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--line)}
.speed button[aria-pressed="true"]{background:var(--berry);color:#fff;box-shadow:0 2px 0 #5038B8}
.wb{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.wb .cell{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wb .cell .bx{width:52px;height:52px;background:var(--paper);border-radius:8px;display:grid;place-items:center;font-family:var(--font-kai);font-size:30px;color:#C5CDDA;box-shadow:0 2px 0 var(--line);overflow:hidden}
.wb .cell .bx svg{width:100%;height:100%}
.wb .cell.now .bx{outline:3px solid var(--sun);color:var(--ink)}
.wb .cell small{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.wb .gap{flex:none;width:6px}
.hwinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.hwinfo .w{font-family:var(--font-kai);font-size:20px;color:var(--berry)}
.reps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.reps button{background:var(--desk);border-radius:12px;padding:10px 4px;font-weight:700}
.reps button[aria-pressed="true"]{background:var(--ink);color:#fff}
.page{background:var(--paper);border-radius:var(--r);padding:14px;display:flex;flex-wrap:wrap;gap:12px 8px;box-shadow:0 4px 0 var(--line)}
.page .word{display:flex;gap:2px}
.page .word svg{width:64px;height:64px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>
<canvas id="confetti"></canvas>

/* ---------- data ---------- */
const chunkCache = {};
async function getChar(ch){
  if(DATA[ch]) return DATA[ch];
  const k = ch.codePointAt(0)%CHUNKS;
  if(!chunkCache[k]) chunkCache[k] = fetch('d/s'+k+'.json').then(r=>{if(!r.ok)throw new Error('load');return r.json()}).catch(e=>{delete chunkCache[k];throw e});
  const m = await chunkCache[k];
  return m[ch]||null;
}
function nums(d){return d.match(/-?\d+(\.\d+)?/g).map(Number)}
function mapPath(d,fx){ // all commands are absolute x y pairs
  let i=0;return d.replace(/-?\d+(\.\d+)?/g,v=>{const r=(i%2===0)?fx.x(+v):fx.y(+v);i++;return r.toFixed(1)});
}
// Build an item: strokes [{d, t:[[x,y],...]}]; optionally recentered/scaled (for single strokes & radical parts)
function makeStrokes(raw,from,to,fit){
  let s = raw.slice(from<0?raw.length+from:from, to).map(([d,t])=>{const p=[];for(let i=0;i<t.length;i+=2)p.push([t[i],t[i+1]]);return {d,t:p}});
  if(!fit) return s;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  s.forEach(st=>{const n=nums(st.d);for(let i=0;i<n.length;i+=2){x0=Math.min(x0,n[i]);x1=Math.max(x1,n[i]);y0=Math.min(y0,n[i+1]);y1=Math.max(y1,n[i+1])}});
  const w=x1-x0,h=y1-y0, sc=Math.min(fit.max, fit.size/Math.max(w,h));
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const fx={x:v=>256+(v-cx)*sc,y:v=>256+(v-cy)*sc};
  return s.map(st=>({d:mapPath(st.d,fx),t:st.t.map(([x,y])=>[fx.x(x),fx.y(y)])}));
}

/* ---------- sound & speech ---------- */
let ac=null;
function tone(freqs,dur=.12,type='sine',gap=.09,vol=.18){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
      const t=ac.currentTime+i*gap;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02)});}catch(e){}
}
const sfx={good:()=>tone([880,1320],.15),great:()=>tone([784,1047,1568],.16),bad:()=>tone([220,180],.18,'triangle',.12,.15),win:()=>tone([523,659,784,1047,1319],.22,'sine',.11)};
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- svg helpers ---------- */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function gridSVG(g,type){
  const st={stroke:'var(--grid)','stroke-width':2.2,fill:'none','vector-effect':'non-scaling-stroke'};
  el('rect',{x:4,y:4,width:504,height:504,rx:6,...st,'stroke-width':3},g);
  const dash={...st,'stroke-dasharray':'7 7',opacity:.75};
  el('line',{x1:256,y1:4,x2:256,y2:508,...dash},g);el('line',{x1:4,y1:256,x2:508,y2:256,...dash},g);
  if(type==='mi'){el('line',{x1:4,y1:4,x2:508,y2:508,...dash,opacity:.45},g);el('line',{x1:508,y1:4,x2:4,y2:508,...dash,opacity:.45},g)}
}
function miniSVG(strokes,color){
  const s=el('svg',{viewBox:'0 0 512 512','aria-hidden':'true'});
  const g=el('g',{},s);gridSVG(g,gridType);
  strokes.forEach(st=>el('path',{d:st.d,fill:color||'var(--ink)'},s));
  return s;
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const cols=['#FF8A2A','#22A86A','#7C5CF0','#2B8CE6','#E06BA8','#F5A800'];
  const ps=Array.from({length:140},()=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.006,r:(4+Math.random()*6)*devicePixelRatio,c:cols[Math.random()*6|0],a:Math.random()*6,s:Math.random()<.4}));
  let f=0;(function tick(){cx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=H*.0009;p.x+=p.vx;p.y+=p.vy;p.a+=.15;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);
    if(p.s){cx.font=(p.r*3)+'px serif';cx.fillText('★',0,0)}else cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
    if(++f<150)requestAnimationFrame(tick);else cx.clearRect(0,0,W,H)})();
}

function basicItems(){return BASIC.map((b,k)=>({key:'b:'+b.name,kind:'stroke',ch:b.ch,from:b.i,to:b.i+1,fit:{size:330,max:1.7},label:b.name,sub:b.tip,speak:b.name,title:'基本筆畫・'+b.name}))}
function unitItems(u){
  const [c,a,b]=u.src;
  const it=[{key:'r:'+u.f,kind:'rad',ch:c,from:a,to:b,fit:(u.f===c? null:{size:360,max:1.35}),label:u.f,sub:u.name,speak:u.name,title:u.name+'「'+u.f+'」'}];
  u.chars.forEach(([ch,w])=>it.push({key:'c:'+ch,kind:'char',ch,from:0,to:99,label:ch,sub:w,speak:`${ch}，${w}的${ch}`,title:`${ch}・${w}`}));
  return it;
}
function unitStars(u){const it=unitItems(u);return it.reduce((a,i)=>a+(progress[i.key]||0),0)}
async function loadItem(it){const raw=await getChar(it.ch);if(!raw)return null;return makeStrokes(raw,it.from,it.to,it.fit)}

async function tilesInto(container,items,color,onPick){
  for(const [k,it] of items.entries()){
    const b=document.createElement('button');b.className='tile';
    b.innerHTML=`<div class="sv"></div><div class="lb">${h(it.label)}</div><div class="sub">${h(it.sub)}</div><div class="stars">${starsHTML(progress[it.key]||0)}</div>`;
    b.setAttribute('aria-label',it.label+' '+it.sub);
    b.onclick=()=>onPick(k);container.appendChild(b);
    loadItem(it).then(s=>{if(s)b.querySelector('.sv').appendChild(miniSVG(s,color))});
  }
}

/* ---------- adventure levels ---------- */
function charStars(c){return progress['c:'+c]||0}
function levelStats(l){const cs=hanOnly(l.chars);const need=lvSettings.need||2;
  const passed=cs.filter(c=>charStars(c)>=need).length;const stars=cs.reduce((a,c)=>a+charStars(c),0);
  return {cs,passed,total:cs.length,stars,max:cs.length*3}}
function levelDone(l){const s=levelStats(l);return s.total>0&&s.passed===s.total}
function levelOpen(k){if(!lvSettings.lock||k===0)return true;return levelDone(levels[k-1])}
function levelItems(l,k){
  const cs=hanOnly(l.chars);
  const it=cs.map(ch=>({key:'c:'+ch,kind:'char',ch,from:0,to:99,label:ch,sub:'',speak:ch,title:`第${k+1}關・${l.title}・${ch}`}));
  return it;
}
function levelMap(){
  if(!levels.length){
    show(`${topbar('闖關冒險',true)}<div class="freebox"><h2 style="font-size:22px">還沒有關卡喔</h2><p class="note">請爸爸媽媽到「家長設定」新增關卡和要學的生字。</p><button class="btn" id="pa">家長設定</button></div>`);
    bindBack(home);document.getElementById('pa').onclick=()=>parentGate(parentHome);return;
  }
  const got=levels.filter(levelDone).length;
  show(`${topbar('闖關冒險',true)}
  <div class="mapbar"><button class="tool" id="bk">🐾 貼紙收集冊 ${got}/${levels.length}</button><button class="tool" id="pa">⚙️ 家長設定</button></div>
  <div class="mapwrap" id="mw"></div>
  <p class="note">每一關的生字都「自己寫」過，就能過關，拿到一張動物貼紙！</p>`);
  bindBack(home);
  document.getElementById('bk').onclick=stickerBook;
  document.getElementById('pa').onclick=()=>parentGate(parentHome);
  const mw=document.getElementById('mw');
  const W=mw.clientWidth||360, step=150, H=levels.length*step+90;
  mw.style.height=H+'px';
  // node positions (bottom = level 1, climbing up like an adventure)
  const pos=levels.map((_,k)=>{const x=[.26,.6,.76,.42][k%4]*W;return [x,H-70-k*step]});
  const svg=el('svg',{class:'road',viewBox:`0 0 ${W} ${H}`},mw);
  let d=`M${pos[0][0]} ${pos[0][1]}`;
  for(let k=1;k<pos.length;k++){const [x0,y0]=pos[k-1],[x1,y1]=pos[k];d+=` C${x0} ${y0-step*.55} ${x1} ${y1+step*.55} ${x1} ${y1}`}
  el('path',{d,fill:'none',stroke:'#fff',"stroke-width":26,"stroke-linecap":'round',opacity:.85},svg);
  el('path',{d,fill:'none',stroke:'#F2C14E',"stroke-width":6,"stroke-dasharray":'2 16',"stroke-linecap":'round'},svg);
  // decorations
  levels.forEach((_,k)=>{const dd=document.createElement('div');dd.className='deco';dd.textContent=DECO[k%DECO.length];
    const left=(k%4<2)?W*.82:W*.08;dd.style.left=left+'px';dd.style.top=(H-70-k*step-60)+'px';mw.appendChild(dd)});
  let cur=-1;
  levels.forEach((l,k)=>{
    const open=levelOpen(k),done=levelDone(l),st=levelStats(l),c=LV_COLORS[k%LV_COLORS.length];
    if(open&&!done&&cur<0)cur=k;
    const b=document.createElement('button');b.className='lvl'+(open?'':' locked');b.style.setProperty('--c',c);
    b.style.left=pos[k][0]+'px';b.style.top=pos[k][1]+'px';
    b.setAttribute('aria-label',`第${k+1}關 ${l.title}${open?'':'（還沒解鎖）'}`);
    b.innerHTML=`<div class="node">${open?k+1:'🔒'}${done?`<span class="badge">${STICKERS[k%STICKERS.length]}</span>`:''}</div><div class="cap">${h(l.title)}</div><div class="st">${open?`★ ${st.stars}/${st.max}`:'&nbsp;'}</div>`;
    b.onclick=()=>{if(!open){sfx.bad();setTimeout(()=>speak('要先通過前一關喔'),50);const n=b.querySelector('.node');n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake');return}levelPage(k)};
    mw.appendChild(b);
  });
  if(cur<0)cur=levels.length-1;
  if(cur>=0){const p=pos[cur];const bd=document.createElement('div');bd.className='buddy';bd.textContent='🐣';bd.style.left=(p[0]+52)+'px';bd.style.top=(p[1]-14)+'px';mw.appendChild(bd);
    mw.querySelectorAll('.lvl')[cur].classList.add('cur');
    requestAnimationFrame(()=>{const r=mw.querySelectorAll('.lvl')[cur].getBoundingClientRect();window.scrollTo(0,Math.max(0,window.scrollY+r.top-innerHeight*.45))});}
}
function levelPage(k){
  const l=levels[k],c=LV_COLORS[k%LV_COLORS.length],st=levelStats(l);
  const items=levelItems(l,k);
  items.onLast=()=>levelCheck(k);
  const pct=st.total?Math.round(st.passed/st.total*100):0;
  show(`${topbar('第 '+(k+1)+' 關',true)}
  <div class="lvhead" style="--c:${c}"><h2>「${h(l.title)}」</h2>
    <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
    <p class="note" style="margin:0">已學會 ${st.passed} / ${st.total} 個字${levelDone(l)?`・已過關 ${STICKERS[k%STICKERS.length]}`:`・全部學會就能拿到 ${STICKERS[k%STICKERS.length]} 貼紙`}</p>
    <button class="btn" id="goFirst">${st.passed?'繼續闖關 ›':'開始闖關 ›'}</button></div>
  <div class="tiles" id="tl"></div>`);
  bindBack(levelMap);
  const need=lvSettings.need||2;
  const firstTodo=Math.max(0,items.findIndex(it=>charStars(it.ch)<need));
  document.getElementById('goFirst').onclick=()=>practice(items,levelDone(l)?0:firstTodo,()=>levelPage(k),c);

/* ---------- practice ---------- */
function resample(pts,n){
  if(pts.length===1)pts=[pts[0],[pts[0][0]+.1,pts[0][1]+.1]];
  const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1]||1e-6,out=[];let j=1;
  for(let k=0;k<n;k++){const d=tot*k/(n-1);while(j<pts.length-1&&L[j]<d)j++;
    const seg=(L[j]-L[j-1])||1e-6,u=Math.min(1,Math.max(0,(d-L[j-1])/seg));
    out.push([pts[j-1][0]+(pts[j][0]-pts[j-1][0])*u,pts[j-1][1]+(pts[j][1]-pts[j-1][1])*u])}
  return {pts:out,len:tot};
}
function compare(user,track,mode){
  const N=24,a=resample(user,N),b=resample(track,N);
  let m=0;for(let i=0;i<N;i++)m+=Math.hypot(a.pts[i][0]-b.pts[i][0],a.pts[i][1]-b.pts[i][1]);m/=N;
  const sd=Math.hypot(a.pts[0][0]-b.pts[0][0],a.pts[0][1]-b.pts[0][1]);
  const ed=Math.hypot(a.pts[N-1][0]-b.pts[N-1][0],a.pts[N-1][1]-b.pts[N-1][1]);
  const lenOK=b.len<60||(a.len>b.len*.35&&a.len<b.len*2.6);
  const tol=mode==='self'?1.2:1;
  const ok=lenOK&&m<52*tol&&sd<85*tol&&ed<85*tol;
  return {ok,mean:m,sd,ed};
}

  }
  function drawBase(){
    L.guide.innerHTML='';L.done.innerHTML='';L.ink.innerHTML='';stopAnims();defs.innerHTML='';
    strokes.forEach((st,i)=>{const cp=el('clipPath',{id:`${uid}c${i}`},defs);el('path',{d:st.d},cp)});
    if(mode!=='self')strokes.forEach(st=>el('path',{d:st.d,fill:'var(--guide)'},L.guide));
  }
  function fillDone(i,col){el('path',{d:strokes[i].d,fill:col||'var(--ink)'},L.done)}
  function updateNeat(){
    const row=document.getElementById('neatRow');if(!quality.length||mode==='demo'){row.hidden=true;return}
    row.hidden=false;const avg=quality.reduce((a,b)=>a+b,0)/quality.length;
    const pct=Math.round(Math.max(0,Math.min(100,(60-avg)/45*100)));
    document.getElementById('neat').style.width=pct+'%';
    document.getElementById('neatTxt').textContent=pct>=80?'超整齊':pct>=55?'很整齊':'加油';
  }

  async function runDemo(){
    mode='demo';setModes();cur=0;quality=[];updateNeat();drawBase();setCount();setSay('看清楚每一筆的順序喔');
    cnt.innerHTML=`共 ${strokes.length} 筆`;
    const token=Symbol();runDemo.t=token;
    await new Promise(r=>setTimeout(r,350));
    for(let i=0;i<strokes.length;i++){
      if(runDemo.t!==token||mode!=='demo')return;
      cnt.innerHTML=`第 <b>${i+1}</b> 筆<br><small>共 ${strokes.length} 筆</small>`;
      const g=await animStroke(i,color);if(!g||runDemo.t!==token)return;
      numLabel(i,L.hint);
      await new Promise(r=>setTimeout(r,160/Math.sqrt(speed)));
    }
    if(runDemo.t===token){cnt.innerHTML=`共 ${strokes.length} 筆`;setSay('換你寫寫看！','good');speak(it.speak);
      if(items.flow)setTimeout(()=>{if(runDemo.t===token&&mode==='demo')startWrite('trace')},1300)}
  }
  function startWrite(m){
    runDemo.t=null;mode=m;setModes();cur=0;mistakes=0;failHere=0;quality=[];updateNeat();drawBase();setCount();
    setSay(m==='trace'?'照著灰色的筆畫描':'不看提示，自己寫寫看');
    showCue();
  }
  function showCue(){L.hint.innerHTML='';if(mode==='trace'&&cur<strokes.length)startDot(cur,L.hint)}

  let selfCount=0;
  function finish(){
    busy=true;
    let earned=1;
    if(mode==='self'){earned=mistakes<=1?3:2}
    const prev=progress[it.key]||0;
    if(earned>prev){progress[it.key]=earned;store.set('progress',progress)}
    if(items.flow){
      const F=items.flow,later=(fn,ms)=>{const t=setTimeout(()=>{busy=false;fn()},ms);F.timer=t};
      document.querySelector('.starcount').innerHTML=`<b>★</b> ${totalStars()}`;
      if(mode==='trace'){sfx.good();setSay('描好了！現在自己寫','good');later(()=>startWrite('self'),1200);return}
      selfCount++;F.best[idx]=Math.max(F.best[idx]||0,earned);
      if(selfCount<F.reps){sfx.good();setSay(`寫好了！再寫一遍（${selfCount+1}/${F.reps}）`,'good');later(()=>startWrite('self'),1200);return}
      sfx.great();confetti();setSay(idx+1<items.length?`「${it.ch}」完成了！下一個字`:'全部寫完了！','good');speak(it.speak);
      F.done[idx]=true;renderStrip();
      later(()=>{idx+1<items.length?practice(items,idx+1,onBack,color):F.onFinish()},1800);
      return;
    }
    sfx.win();confetti();speak(it.speak);
    const avg=quality.reduce((a,b)=>a+b,0)/quality.length;
    const praise=mode==='self'?(earned===3?`${profile.name}太厲害了！`:`${profile.name}寫完了，好棒！`):`描得真好，${profile.name}！`;
    const ov=document.createElement('div');ov.className='over';
    ov.innerHTML=`<div class="box" role="dialog" aria-label="完成"><div class="big">${starsHTML(earned)}</div><h3>${h(praise)}</h3>
      <p>${mode==='self'?(mistakes?`寫錯了 ${mistakes} 次，下次再少一點！`:'一次都沒寫錯！'):'下一步：不看灰色提示，自己寫寫看，可以拿到更多星星。'}</p>
      <p>整齊度：${avg<22?'超整齊 ✨':avg<34?'很整齊':'還可以更整齊'}</p>
      <div class="row">${mode==='trace'?`<button class="btn" data-a="self">自己寫寫看</button>`:''}
      ${items.onLast&&mode==='self'&&idx===items.length-1?`<button class="btn green" data-a="last">看看過關了沒 ›</button>`:items.length>1&&mode==='self'?`<button class="btn green" data-a="next">下一個 ›</button>`:''}
      <button class="btn alt" data-a="again">再寫一次</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ov.remove();busy=false;const a=b.dataset.a;
      if(a==='last')items.onLast();else if(a==='self')startWrite('self');else if(a==='again')startWrite(mode);else practice(items,(idx+1)%items.length,onBack,color)});
    cleanupOv=()=>ov.remove();
    document.querySelector('.starcount').innerHTML=`<b>★</b> ${totalStars()}`;
  }
  let cleanupOv=null;

  async function evaluate(pts){
    const r=compare(pts,strokes[cur].t,mode);
    if(r.ok){
      const i=cur;quality.push(r.mean);cur++;failHere=0;
      L.ink.innerHTML='';fillDone(i,color);
      const great=r.mean<24;(great?sfx.great:sfx.good)();
      setSay(great?['超漂亮！','完美！','好整齊！'][Math.random()*3|0]:['對了！','很好！','好棒！'][Math.random()*3|0],'good');
      updateNeat();setCount();
      if(cur>=strokes.length){L.hint.innerHTML='';setTimeout(finish,450)}else showCue();
      return;
    }
    // wrong: which stroke did they draw?
    let other=-1;for(let j=cur+1;j<strokes.length;j++){if(compare(pts,strokes[j].t,mode).ok){other=j;break}}
    mistakes++;failHere++;sfx.bad();
    const pl=L.ink.querySelector('polyline');if(pl){pl.setAttribute('stroke','var(--grid)');pl.animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards'})}
    bd.classList.remove('shake');void bd.getBoundingClientRect();bd.classList.add('shake');
    if(other>=0)setSay(`順序不對喔，這是第 ${other+1} 筆`,'bad');
    else if(r.sd>85&&r.ed>85&&compare(pts.slice().reverse(),strokes[cur].t,mode).ok)setSay('方向寫反了，從紫色點開始','bad');
    else setSay(mode==='self'&&failHere<2?'再試一次':'看一下這一筆怎麼寫','bad');
    if(mode==='trace'||failHere>=2){busy=true;L.hint.innerHTML='';await animStroke(cur,tint(color,.55));L.anim.innerHTML='';busy=false;
      if(mode==='self'){startDot(cur,L.hint);setTimeout(()=>{if(mode==='self')L.hint.innerHTML=''},1800)}else showCue()}
  }

  // pointer input
  function toSvg(e){const p=bd.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=bd.getScreenCTM().inverse();const q=p.matrixTransform(m);return [q.x,q.y]}
  bd.addEventListener('pointerdown',e=>{
    if(mode==='demo'){if(!busy)startWrite('trace');return}
    if(busy||!strokes||cur>=strokes.length||drawing)return;
    e.preventDefault();bd.setPointerCapture(e.pointerId);
    L.ink.innerHTML='';
    drawing={id:e.pointerId,pts:[toSvg(e)],pl:el('polyline',{fill:'none',stroke:'var(--ink)','stroke-width':30,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.85},L.ink)};
    drawing.pl.setAttribute('points',drawing.pts.map(p=>p.join(',')).join(' '));
  });
  bd.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==drawing.id)return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    evs.forEach(ev=>{const p=toSvg(ev),l=drawing.pts[drawing.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>2)drawing.pts.push(p)});
    drawing.pl.setAttribute('points',drawing.pts.map(p=>p.join(',')).join(' '))});
  const up=e=>{if(!drawing||e.pointerId!==drawing.id)return;const pts=drawing.pts;drawing=null;evaluate(pts)};
  bd.addEventListener('pointerup',up);bd.addEventListener('pointercancel',e=>{if(drawing&&e.pointerId===drawing.id){drawing=null;L.ink.innerHTML=''}});

  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(!strokes)return;b.dataset.m==='demo'?runDemo():startWrite(b.dataset.m)});
  document.getElementById('tReplay').onclick=()=>strokes&&runDemo();
  document.getElementById('tAgain').onclick=()=>strokes&&(mode==='demo'?runDemo():startWrite(mode));
  document.getElementById('tSpeak').onclick=()=>speak(it.speak);
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;store.set('speed',speed);
    app.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x===b));if(strokes&&mode==='demo')runDemo()});
  document.getElementById('tGrid').onclick=e=>{gridType=gridType==='tian'?'mi':'tian';store.set('grid',gridType);e.target.textContent=gridType==='tian'?'田字格':'米字格';L.grid.innerHTML='';gridSVG(L.grid,gridType)};
  const nx=document.getElementById('tNext');if(nx)nx.onclick=()=>practice(items,(idx+1)%items.length,onBack,color);
  if(items.flow)renderStrip();
  cleanup=()=>{if(items.flow)clearTimeout(items.flow.timer);runDemo.t=null;stopAnims();if(cleanupOv)cleanupOv();document.querySelectorAll('.over').forEach(o=>o.remove())};

  setModes();setSay('載入中…');
  loadItem(it).then(s=>{if(!s){setSay('找不到這個字的筆順','bad');return}strokes=s;runDemo()}).catch(()=>setSay('載入失敗，請檢查網路','bad'));
}

home();
</script>
